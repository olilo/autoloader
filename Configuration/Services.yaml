services:
  HDNET\Autoloader\Listener\DatabaseListener:
    tags:
      - name: event.listener
        identifier: 'autoloader/databaseListener'
        method: 'triggerEvent'
        event: TYPO3\CMS\Core\Database\Event\AlterTableDefinitionStatementsEvent
  HDNET\Autoloader\Listener\ElementBackendPreviewListener:
    tags:
      - name: event.listener
        identifier: 'autoloader/elementBackendPreviewListener'
        event: TYPO3\CMS\Backend\View\Event\PageContentPreviewRenderingEvent
